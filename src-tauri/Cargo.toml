[package]
name = "taut_desktop"
version = "1.4.4-alpha.4"
description = "TAUT Desktop"
authors = ["TAUT"]
edition = "2021"

[lib]
name = "taut_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
percent-encoding = "2"

tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSThread"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem"] }
rfd = { version = "0.15.4", default-features = false }

# Keep local development/test artifacts smaller. The test profile inherits dev.
# Retain file/line backtraces without full type/variable debug information.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Third-party dependencies account for most of target/debug/deps.
[profile.dev.package."*"]
debug = false
