name: Windows alpha candidate

on:
  push:
    branches: [feat/message-deletion]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-alpha.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-alpha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: Internal Windows ${{ matrix.arch }} candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            machine: 'aa64'
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            machine: '8664'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - run: npm ci
      - run: npm test
      - run: npm run check:ui
      - name: Test backend with mocked Graph only
        working-directory: src-tauri
        run: cargo +stable test --locked --lib
      - name: Build unsigned internal installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles nsis --config src-tauri/tauri.windows.conf.json -- --locked
      - name: Verify executable architecture
        shell: pwsh
        run: |
          $exe = [IO.File]::ReadAllBytes('src-tauri/target/${{ matrix.target }}/release/taut_desktop.exe')
          $pe = [BitConverter]::ToInt32($exe, 0x3c)
          $expected = [Convert]::ToUInt16('${{ matrix.machine }}', 16)
          if ([BitConverter]::ToUInt16($exe, $pe + 4) -ne $expected) { throw "Unexpected executable architecture for ${{ matrix.arch }}" }
      - name: Checksum installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected one installer" }
          $hash = Get-FileHash $installers[0].FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($installers[0].Name)" | Set-Content -Encoding ascii src-tauri/target/${{ matrix.target }}/release/bundle/nsis/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TAUT-windows-${{ matrix.arch }}-alpha-${{ github.sha }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
